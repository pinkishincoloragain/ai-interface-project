name: PR Bot Comments

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-analysis:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: PR Size Check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const additions = files.reduce((acc, file) => acc + file.additions, 0);
            const deletions = files.reduce((acc, file) => acc + file.deletions, 0);
            const totalChanges = additions + deletions;
            
            let sizeLabel, message;
            if (totalChanges < 50) {
              sizeLabel = 'size/XS';
              message = '🟢 **Tiny PR** - Quick review expected!';
            } else if (totalChanges < 200) {
              sizeLabel = 'size/S';
              message = '🟡 **Small PR** - Should be easy to review.';
            } else if (totalChanges < 500) {
              sizeLabel = 'size/M';
              message = '🟠 **Medium PR** - Will need some time to review properly.';
            } else if (totalChanges < 1000) {
              sizeLabel = 'size/L';
              message = '🔴 **Large PR** - Consider breaking into smaller PRs.';
            } else {
              sizeLabel = 'size/XL';
              message = '⚠️ **Huge PR** - This will be difficult to review. Please consider splitting.';
            }
            
            // Add size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel]
            });
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${message}\n\n📊 **Changes**: +${additions} -${deletions} (${files.length} files)\n\n---\n*Automated PR analysis*`
            });

  security-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Security Scan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const securityPatterns = [
              { pattern: /password|secret|key|token/i, risk: 'HIGH', message: 'Potential secrets detected' },
              { pattern: /api[_-]?key|access[_-]?token/i, risk: 'HIGH', message: 'API credentials detected' },
              { pattern: /console\.log|console\.warn|console\.error/i, risk: 'LOW', message: 'Console statements found' },
              { pattern: /eval\(|innerHTML|outerHTML/i, risk: 'MEDIUM', message: 'Potentially unsafe code patterns' },
              { pattern: /http:\/\/(?!localhost)/i, risk: 'MEDIUM', message: 'HTTP URLs found (use HTTPS)' }
            ];
            
            let issues = [];
            
            for (const file of files) {
              if (file.patch) {
                for (const pattern of securityPatterns) {
                  if (pattern.pattern.test(file.patch)) {
                    issues.push({
                      file: file.filename,
                      risk: pattern.risk,
                      message: pattern.message
                    });
                  }
                }
              }
            }
            
            if (issues.length > 0) {
              const riskGroups = issues.reduce((acc, issue) => {
                if (!acc[issue.risk]) acc[issue.risk] = [];
                acc[issue.risk].push(`- \`${issue.file}\`: ${issue.message}`);
                return acc;
              }, {});
              
              let comment = '🔍 **Security Review**\n\n';
              
              if (riskGroups.HIGH) {
                comment += '🚨 **HIGH RISK**\n' + riskGroups.HIGH.join('\n') + '\n\n';
              }
              if (riskGroups.MEDIUM) {
                comment += '⚠️ **MEDIUM RISK**\n' + riskGroups.MEDIUM.join('\n') + '\n\n';
              }
              if (riskGroups.LOW) {
                comment += 'ℹ️ **LOW RISK**\n' + riskGroups.LOW.join('\n') + '\n\n';
              }
              
              comment += '---\n*Automated security scan - Please review these items*';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check Dependencies
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const packageFiles = files.filter(f => 
              f.filename.includes('package.json') || 
              f.filename.includes('pnpm-lock.yaml') ||
              f.filename.includes('yarn.lock')
            );
            
            if (packageFiles.length > 0) {
              let comment = '📦 **Dependency Changes Detected**\n\n';
              
              for (const file of packageFiles) {
                comment += `- \`${file.filename}\` (+${file.additions} -${file.deletions})\n`;
              }
              
              comment += '\n⚠️ **Please ensure:**\n';
              comment += '- [ ] New dependencies are necessary\n';
              comment += '- [ ] Dependencies are from trusted sources\n';
              comment += '- [ ] No security vulnerabilities in new packages\n';
              comment += '- [ ] Package versions are pinned appropriately\n\n';
              comment += '---\n*Run `pnpm audit` to check for vulnerabilities*';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }