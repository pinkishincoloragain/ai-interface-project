name: Enhanced PR Bot Comments

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-analysis:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Enhanced PR Size Analysis
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const additions = files.reduce((acc, file) => acc + file.additions, 0);
            const deletions = files.reduce((acc, file) => acc + file.deletions, 0);
            const totalChanges = additions + deletions;
            
            let sizeLabel, message, reviewTime, complexity;
            if (totalChanges < 50) {
              sizeLabel = 'size/XS';
              message = '🟢 **Tiny PR**';
              reviewTime = '⏱️ **5-10 minutes**';
              complexity = 'Perfect size for a quick review! 🚀';
            } else if (totalChanges < 200) {
              sizeLabel = 'size/S';
              message = '🟡 **Small PR**';
              reviewTime = '⏱️ **15-20 minutes**';
              complexity = 'Nice and focused - should be straightforward to review. 👍';
            } else if (totalChanges < 500) {
              sizeLabel = 'size/M';
              message = '🟠 **Medium PR**';
              reviewTime = '⏱️ **30-45 minutes**';
              complexity = 'Moderate size - will need some dedicated time for proper review. 🤔';
            } else if (totalChanges < 1000) {
              sizeLabel = 'size/L';
              message = '🔴 **Large PR**';
              reviewTime = '⏱️ **1-2 hours**';
              complexity = 'This is getting quite large. Consider if this could be split into smaller, more focused PRs for easier review. 📝';
            } else {
              sizeLabel = 'size/XL';
              message = '⚠️ **Huge PR**';
              reviewTime = '⏱️ **2+ hours**';
              complexity = 'Whoa! This is a substantial change. Breaking this into smaller PRs would make it much easier to review thoroughly and reduce the chance of missing issues. 🔍';
            }
            
            // Analyze file types for additional insights
            const fileTypes = files.reduce((acc, file) => {
              const ext = file.filename.split('.').pop();
              if (ext) {
                acc[ext] = (acc[ext] || 0) + 1;
              }
              return acc;
            }, {});
            
            const hasTests = files.some(f => f.filename.includes('test') || f.filename.includes('spec'));
            const hasDocs = files.some(f => f.filename.endsWith('.md') || f.filename.endsWith('.txt'));
            const hasConfig = files.some(f => f.filename.endsWith('.json') || f.filename.endsWith('.yml') || f.filename.endsWith('.yaml'));
            
            // Add size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel]
            });
            
            // Create detailed analysis
            let fileTypeAnalysis = Object.entries(fileTypes)
              .sort(([,a], [,b]) => b - a)
              .slice(0, 5)
              .map(([ext, count]) => `\`${ext}\` (${count})`)
              .join(', ');
            
            let quickInsights = [];
            if (hasTests) quickInsights.push('✅ Tests included');
            if (hasDocs) quickInsights.push('📚 Documentation updated');
            if (hasConfig) quickInsights.push('⚙️ Configuration changes');
            if (quickInsights.length === 0) quickInsights.push('📝 Code changes only');
            
            // Post comprehensive comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${message} - PR Size Analysis

${complexity}

### 📊 **Change Summary**
- **Files modified**: ${files.length}
- **Lines changed**: +${additions} -${deletions} (${totalChanges} total)
- **Estimated review time**: ${reviewTime}

### 🔍 **What's in this PR**
- **File types**: ${fileTypeAnalysis}
- **Quick insights**: ${quickInsights.join(' • ')}

### 💡 **Review Tips**
${totalChanges < 200 ? 
  '- Focus on logic correctness and edge cases\n- Check for consistent code style\n- Verify any new dependencies are necessary' :
  '- Consider reviewing in multiple sessions\n- Pay extra attention to core functionality changes\n- Ensure all edge cases are covered\n- Check if this could be split into focused PRs'
}

---
*Automated analysis to help with review planning* 📝`
            });

  enhanced-security-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Enhanced Security Analysis
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const securityPatterns = [
              { pattern: /password|secret|key|token/i, risk: 'HIGH', message: 'Potential secrets detected' },
              { pattern: /api[_-]?key|access[_-]?token/i, risk: 'HIGH', message: 'API credentials detected' },
              { pattern: /console\.log|console\.warn|console\.error/i, risk: 'LOW', message: 'Console statements found' },
              { pattern: /eval\(|innerHTML|outerHTML/i, risk: 'MEDIUM', message: 'Potentially unsafe code patterns' },
              { pattern: /http:\/\/(?!localhost)/i, risk: 'MEDIUM', message: 'HTTP URLs found (use HTTPS)' }
            ];
            
            let issues = [];
            
            for (const file of files) {
              if (file.patch) {
                for (const pattern of securityPatterns) {
                  if (pattern.pattern.test(file.patch)) {
                    issues.push({
                      file: file.filename,
                      risk: pattern.risk,
                      message: pattern.message
                    });
                  }
                }
              }
            }
            
            if (issues.length > 0) {
              const riskGroups = issues.reduce((acc, issue) => {
                if (!acc[issue.risk]) acc[issue.risk] = [];
                acc[issue.risk].push({ file: issue.file, message: issue.message });
                return acc;
              }, {});
              
              let comment = '## 🔐 Security Analysis\n\n';
              comment += 'Hey! I spotted some potential security considerations in your code. Let me walk through what caught my attention:\n\n';
              
              if (riskGroups.HIGH) {
                comment += '### 🚨 **High Priority Items**\n';
                comment += '*These really should be addressed before merging*\n\n';
                riskGroups.HIGH.forEach(issue => {
                  comment += `- **\`${issue.file}\`** - ${issue.message}\n`;
                  comment += `  *This could be a serious security risk if not handled properly*\n`;
                });
                comment += '\n';
              }
              
              if (riskGroups.MEDIUM) {
                comment += '### ⚠️ **Medium Priority Items**\n';
                comment += '*Worth reviewing and considering alternatives*\n\n';
                riskGroups.MEDIUM.forEach(issue => {
                  comment += `- **\`${issue.file}\`** - ${issue.message}\n`;
                  comment += `  *Consider if there\'s a more secure approach*\n`;
                });
                comment += '\n';
              }
              
              if (riskGroups.LOW) {
                comment += '### ℹ️ **Low Priority Items**\n';
                comment += '*Minor things to consider for code quality*\n\n';
                riskGroups.LOW.forEach(issue => {
                  comment += `- **\`${issue.file}\`** - ${issue.message}\n`;
                  comment += `  *Not critical, but worth cleaning up*\n`;
                });
                comment += '\n';
              }
              
              comment += '### 💡 **Security Best Practices Reminder**\n';
              comment += '- Never commit API keys, passwords, or tokens to the repository\n';
              comment += '- Use environment variables for sensitive configuration\n';
              comment += '- Sanitize user inputs and validate data\n';
              comment += '- Consider using HTTPS for all external communications\n';
              comment += '- Remove debug logging before production deployment\n\n';
              
              comment += '### 🎯 **What to do next**\n';
              comment += 'Review the flagged items above and decide if they need changes. ';
              comment += 'If you\'re confident they\'re safe in context, that\'s totally fine! ';
              comment += 'This scanner errs on the side of caution.\n\n';
              
              comment += '---\n*Automated security scan - helping keep your code secure! 🛡️*';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  enhanced-dependency-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Enhanced Dependency Analysis
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const packageFiles = files.filter(f => 
              f.filename.includes('package.json') || 
              f.filename.includes('pnpm-lock.yaml') ||
              f.filename.includes('yarn.lock')
            );
            
            if (packageFiles.length > 0) {
              let comment = '## 📦 Dependency Changes Detected\n\n';
              comment += 'I noticed you\'ve made some dependency changes! Let me help you review them:\n\n';
              
              comment += '### 🔍 **Files Modified**\n';
              for (const file of packageFiles) {
                comment += `- **\`${file.filename}\`** - ${file.additions} additions, ${file.deletions} deletions\n`;
                if (file.filename.includes('package.json')) {
                  comment += '  *This affects your project dependencies*\n';
                } else if (file.filename.includes('lock')) {
                  comment += '  *This locks specific versions for reproducible builds*\n';
                }
              }
              
              comment += '\n### 🛡️ **Security Checklist**\n';
              comment += 'Before merging, let\'s make sure we\'ve covered the bases:\n\n';
              comment += '- [ ] **Necessity Check**: Are all new dependencies actually needed?\n';
              comment += '- [ ] **Trust Verification**: Are these packages from reputable maintainers?\n';
              comment += '- [ ] **Vulnerability Scan**: Run `pnpm audit` to check for known issues\n';
              comment += '- [ ] **Version Pinning**: Are versions appropriately constrained?\n';
              comment += '- [ ] **Bundle Size Impact**: Will this significantly increase your app size?\n\n';
              
              comment += '### 💡 **Pro Tips**\n';
              comment += '- Check the package\'s GitHub repository for activity and maintenance status\n';
              comment += '- Review recent issues and security advisories\n';
              comment += '- Consider if there are lighter alternatives that meet your needs\n';
              comment += '- Document why the dependency was added in your PR description\n\n';
              
              comment += '### 🚀 **Next Steps**\n';
              comment += '1. Run `pnpm audit` locally to check for vulnerabilities\n';
              comment += '2. Test that the changes work as expected\n';
              comment += '3. Update documentation if the changes affect setup or usage\n\n';
              
              comment += '---\n*Dependency management is crucial for security and maintainability! 🔐*';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }